<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuneScape Skill Calculator (Web)</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left-stack">
      <div class="app-brand" aria-label="RS Skill Calculator">
        <img class="app-brand-logo" src="./assets/logo.svg" alt="" />
        <span class="app-brand-text">RS3 Skill Calculator</span>
      </div>
      <div class="topbar-group topbar-left">
        <button id="exportDataBtn" type="button">Export Data</button>
        <button id="importDataBtn" type="button">Import Data</button>
        <button id="resetAllDataBtn" type="button">Reset All Data</button>
        <input id="importDataFile" type="file" accept="application/json,.json" hidden />
      </div>
    </div>
    <div class="topbar-group topbar-center">
      <label for="profileSelect">Profile</label>
      <select id="profileSelect"></select>
      <button id="newProfileBtn" type="button">New</button>
      <button id="deleteProfileBtn" type="button">Delete</button>
      <button id="importRs3Btn" type="button">Import RS3 High Scores</button>
    </div>
    <div class="topbar-group topbar-right">
      <label class="toggle-inline"><input id="virtualToggle" type="checkbox" /> Virtual levels</label>
      <div id="saveStatus" class="save-status">Not saved</div>
    </div>
  </header>

  <main class="app-shell">
    <aside class="skills-panel panel">
      <div class="panel-title">
        <h2>Skills</h2>
        <button id="resetSkillOrderBtn" type="button">Reset</button>
      </div>
      <div id="skillsGrid" class="skills-grid"></div>
    </aside>

    <section class="detail-panel panel">
      <div class="detail-left">
        <div class="detail-left-tabbar">
          <button id="centerTabCurrent" class="detail-left-tab active" type="button">Current + Boosts</button>
          <button id="centerTabGoals" class="detail-left-tab" type="button">Goals</button>
        </div>

        <div id="centerPaneCurrent" class="detail-left-pane active">
          <section class="card" id="currentCard">
            <h3 id="currentTitle">Current</h3>
            <div class="field-grid">
              <label for="currentXp">Current XP</label>
              <input id="currentXp" type="number" min="0" step="1" />
              <label>Boost factor</label>
              <div id="boostFactor" class="value">x1.00</div>
              <label>Goal tracking</label>
              <label><input id="goalTrackingEnabled" type="checkbox" /> Enable</label>
              <span></span>
              <button id="resetSkillSettingsBtn" type="button">Reset Skill Settings</button>
            </div>
          </section>

          <section class="card boosts-card" id="boostsCard">
            <h3>Boosts</h3>
            <div id="boostsWrap" class="side-tabs"></div>
          </section>
        </div>

        <div id="centerPaneGoals" class="detail-left-pane">
          <section class="card goal-card" id="goalStartCard">
            <h3>Goal Start</h3>
            <div class="field-grid">
              <label>Goal start by</label>
              <div class="radio-row">
                <label><input type="radio" name="goalStartBy" value="level" /> Level</label>
                <label><input type="radio" name="goalStartBy" value="xp" checked /> XP</label>
              </div>
              <label id="goalStartLevelLabel" for="goalStartLevel">Goal start level</label>
              <input id="goalStartLevel" type="number" min="1" step="1" />
              <label id="goalStartXpLabel" for="goalStartXp">Goal start XP</label>
              <input id="goalStartXp" type="number" min="0" step="1" />
              <label id="goalStartResolvedLabel">Resolved XP</label>
              <div id="goalStartResolved" class="value">0 XP</div>
              <span></span>
              <button id="useCurrentAsStartBtn" type="button">Use Current as Goal Start</button>
            </div>
          </section>

          <section class="card goal-card" id="goalEndCard">
            <h3>Goal End</h3>
            <div class="field-grid">
              <label>Goal end by</label>
              <div class="radio-row">
                <label><input type="radio" name="goalEndBy" value="level" checked /> Level</label>
                <label><input type="radio" name="goalEndBy" value="xp" /> XP</label>
                <label><input type="radio" name="goalEndBy" value="max" /> MAX</label>
              </div>
              <label id="goalEndLevelLabel" for="goalEndLevel">Goal end level</label>
              <input id="goalEndLevel" type="number" min="1" step="1" />
              <label id="goalEndXpLabel" for="goalEndXp">Goal end XP</label>
              <input id="goalEndXp" type="number" min="0" step="1" />
              <label id="goalEndResolvedLabel">Resolved XP</label>
              <div id="goalEndResolved" class="value">0 XP</div>
            </div>
          </section>

          <section class="card goal-card" id="goalStatsCard">
            <h3>Goal Statistics</h3>
            <div class="field-grid">
              <label>Goal start level</label><div id="goalStartLevelResolved" class="value">1</div>
              <label>Goal end level</label><div id="goalEndLevelResolved" class="value">1</div>
              <label>XP needed (from current)</label><div id="xpNeeded" class="value">0</div>
              <label>Goal progress</label><div id="goalProgressText" class="value">Disabled (enable goal tracking)</div>
              <label>Progress bar</label>
              <div class="progress-wrap"><div id="goalProgressBar" class="progress-bar"></div></div>
            </div>
          </section>
        </div>

        <section class="card" id="validationCard">
          <h3>Skill File Issues</h3>
          <div id="validationList" class="validation-list"></div>
        </section>
      </div>

      <div class="detail-right card">
        <div class="methods-card-head">
          <h3 id="methodsTitle">Methods</h3>
          <div id="methodsHeaderControls" class="methods-header-controls"></div>
        </div>
        <div id="methodsWrap" class="side-tabs methods-wrap"></div>
      </div>
    </section>
  </main>
  <footer class="app-footer">
    <div class="footer-left">
      <button id="aboutBtn" type="button">Version</button>
      <button id="instructionsBtn" type="button">Instructions</button>
      <button id="reportIssueBtn" type="button">Report Issue</button>
      <label class="notify-toggle"><input id="disableNotificationsToggle" type="checkbox" /> disabled notification</label>
    </div>
    <div class="footer-info">RuneScape Skill Calculator Web | Created by EmberOfAshes | MIT License</div>
  </footer>
  <div id="bottomNotice" class="bottom-notice" aria-live="polite" aria-atomic="true"></div>
  <div id="wikiPreview" class="wiki-preview" hidden aria-hidden="true"></div>
  <div id="changelogModal" class="modal" hidden>
    <div class="modal-backdrop" id="changelogBackdrop"></div>
    <div class="modal-card">
      <div class="modal-head">
        <div id="changelogTitle">Changelog</div>
        <button id="closeChangelogBtn" type="button">Close</button>
      </div>
      <div id="changelogContent" class="changelog-content"></div>
    </div>
  </div>
  <div id="instructionsModal" class="modal" hidden>
    <div class="modal-backdrop" id="instructionsBackdrop"></div>
    <div class="modal-card">
      <div class="modal-head">
        <div id="instructionsTitle">Instructions</div>
        <button id="closeInstructionsBtn" type="button">Close</button>
      </div>
      <div id="instructionsContent" class="changelog-content"></div>
    </div>
  </div>

  <template id="skillButtonTemplate">
    <button class="skill-btn" type="button" draggable="true">
      <div class="skill-btn-title"></div>
      <div class="skill-btn-mid">
        <img class="skill-btn-icon" alt="" />
        <div class="skill-btn-lines">
          <div class="skill-btn-level"></div>
          <div class="skill-btn-xp"></div>
        </div>
      </div>
      <div class="skill-btn-mode"></div>
      <div class="skill-btn-progress"><div class="skill-btn-progress-fill"></div></div>
    </button>
  </template>

  <script src="./import-config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
